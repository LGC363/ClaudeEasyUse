appId: com.claudeeasyuse.app
productName: ClaudeEasyUse
copyright: MIT

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.md"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/__tests__/**"

win:
  icon: resources/icon.ico
  target:
    - target: portable
      arch:
        - x64

portable:
  artifactName: ClaudeEasyUse-${version}-portable.exe

# shipping defaults
npmRebuild: false
asar: true
forceCodeSigning: false

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable bundle
        shell: pwsh
        run: npm run dist:portable:zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*win-x64-unpacked.zip
          generate_release_notes: true
          draft: false
          prerelease: false
